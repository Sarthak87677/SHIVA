[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shiva-1"
version = "0.1.0"
description = "SHIVA-1: alternate-physics generation, universe simulation, emergence detection, AI-driven technology evolution, real-world mapping and CAD."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12", "matplotlib>=3.7"]

[project.optional-dependencies]
notebook = ["nbformat>=5", "nbclient>=0.7", "ipykernel>=6"]
physics = ["pybullet>=3.2"]
dev = ["pytest>=7"]

[project.scripts]
shiva = "shiva_core.__main__:main"

[tool.setuptools]
packages = ["shiva_core"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
